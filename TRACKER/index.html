<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeFinance // Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .vibrant-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight">Vibe<span class="text-indigo-400">Finance</span></h1>
            <div class="vibrant-gradient px-4 py-2 rounded-full text-sm font-semibold shadow-lg">May 2026</div>
        </header>

        <!-- Hero Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass p-6 rounded-3xl shadow-xl">
                <p class="text-slate-400 text-sm mb-1 font-medium uppercase tracking-wider">Total Balance</p>
                <h2 class="text-4xl font-bold text-white">$4,250.00</h2>
            </div>
            <div class="glass p-6 rounded-3xl shadow-xl border-l-4 border-emerald-500">
                <p class="text-slate-400 text-sm mb-1 font-medium uppercase tracking-wider">Income</p>
                <h2 class="text-3xl font-bold text-emerald-400">+$1,200.00</h2>
            </div>
            <div class="glass p-6 rounded-3xl shadow-xl border-l-4 border-rose-500">
                <p class="text-slate-400 text-sm mb-1 font-medium uppercase tracking-wider">Expenses</p>
                <h2 class="text-3xl font-bold text-rose-400">-$450.00</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Add Transaction -->
            <div class="glass p-8 rounded-3xl">
                <h3 class="text-xl font-bold mb-6">New Transaction</h3>
                <form id="transaction-form" class="space-y-4">
                    <input type="text" placeholder="Description (e.g. Groceries)" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    <input type="number" placeholder="Amount ($)" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    <div class="flex gap-4">
                        <button type="button" class="flex-1 py-3 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold hover:bg-emerald-500 hover:text-white transition-all">Income</button>
                        <button type="button" class="flex-1 py-3 rounded-xl bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold hover:bg-rose-500 hover:text-white transition-all">Expense</button>
                    </div>
                </form>
            </div>

            <!-- Chart Visualization -->
            <div class="glass p-8 rounded-3xl flex items-center justify-center">
                <canvas id="expenseChart" width="200" height="200"></canvas>
            </div>
        </div>

        <!-- Recent History -->
        <div class="mt-8">
            <h3 class="text-xl font-bold mb-4">Recent Activity</h3>
            <div class="space-y-3">
                <div class="glass p-4 rounded-2xl flex justify-between items-center hover:translate-x-2 transition-transform cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400">🛒</div>
                        <div>
                            <p class="font-semibold">Supermarket</p>
                            <p class="text-xs text-slate-500">Today, 2:30 PM</p>
                        </div>
                    </div>
                    <span class="font-bold text-rose-400">-$65.00</span>
                </div>
                <!-- Add more items here -->
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('expenseChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Food', 'Tech', 'Rent', 'Fun'],
                datasets: [{
                    data: [12, 19, 30, 5],
                    backgroundColor: ['#6366f1', '#10b981', '#fb7185', '#f59e0b'],
                    borderWidth: 0,
                    hoverOffset: 10
                }]
            },
            options: {
                plugins: { legend: { labels: { color: '#94a3b8', font: { weight: 'bold' } } } },
                cutout: '70%'
            }
        });
    </script>
</body>
</html>

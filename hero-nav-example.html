<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hero + Nav Example</title>
  <link rel="stylesheet" href="hero-nav.css">
</head>
<body>
  <nav class="example-navbar">
    <div class="logo">JOSEPH NGINYA</div>
    <button id="nav-toggle" class="hamburger" aria-expanded="false" aria-controls="main-menu">☰</button>

    <ul id="main-menu" class="main-menu" role="menu">
      <li role="none"><a role="menuitem" href="index.html">Home</a></li>
      <li role="none"><a role="menuitem" href="index.html#about">About</a></li>
      <li class="has-submenu" role="none">
        <button class="submenu-toggle" aria-expanded="false" aria-controls="services-submenu">Services ▸</button>
        <ul id="services-submenu" class="submenu" role="menu">
          <li role="none"><a role="menuitem" href="web-development.html">Web Development</a></li>
          <li role="none"><a role="menuitem" href="ui-ux.html">UI/UX Design</a></li>
          <li role="none"><a role="menuitem" href="consulting.html">Consulting</a></li>
        </ul>
      </li>
      <li role="none"><a role="menuitem" href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main class="hero-wrap">
    <section class="hero">
      <div class="hero-text">
        <h1>Hello — I'm Joseph</h1>
        <p>Frontend developer crafting clean, usable interfaces and delightful user experiences.</p>
        <p><a class="cta" href="#contact">Work with me</a></p>
      </div>

      <div class="hero-media">
        <!-- Replace with your image at images/hero.jpg or change src -->
        <img src="images/hero.jpg" alt="Portrait of Joseph" class="hero-image hero-image--rounded">
      </div>
    </section>
  </main>

  <script src="hero-nav.js" defer></script>
</body>
</html>
